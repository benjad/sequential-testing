[tool.poetry]
name = "sequential-testing"
version = "0.1.0"
description = "collection of sequential testing methods"
authors = ["Benja Duran <bndrn@tutamail.com>"]
license = "MIT"
readme = "README.md"
package-mode = true

[tool.poetry.dependencies]
python = "^3.12"
numpy = "2.3.4"
matplotlib = "^3.10.7"
scipy = "^1.16.3"


[tool.poetry.group.dev.dependencies]
ipykernel = "^7.1.0"
black = "^26.5.1"
pytest = "^9.1.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100

[tool.pytest.ini_options]
pythonpath = "."